name: CI

# PDK-free lint: Python compiles, JSON is well-formed, shell parses, RTL is
# Verilator-clean (skipped until RTL exists). Runnable locally with
# `bash .github/scripts/lint.sh`.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: bash .github/scripts/lint.sh
